name: Verificar regras do CineGlobo Simulator
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar-regras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar validação de vendas fictícias
        run: node --test tests/*.test.mjs
