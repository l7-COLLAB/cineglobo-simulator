name: Validar Safari WebKit móvel
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - name: Verificar visualização e gestos no WebKit móvel (Linux)
        run: npx playwright test --config playwright.webkit.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-webkit-mobile
          path: test-results
